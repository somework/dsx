name: Feature request
description: Something dsx should be able to do and cannot.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: The task, not the feature. What did you reach for dsx to accomplish?
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: >
        Including the workaround, if there is one. `dsx raw <tool> '<json-args>'`
        reaches any tool the named commands do not wrap, so a gap in the CLI and
        a gap in what the server can do are different requests.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: What it would cost
      description: >
        Optional, and worth a sentence if you know. dsx is stdlib-only and every
        sync verb answers to invariants that were paid for by real data loss
        (CLAUDE.md). A feature that needs a dependency, or that relaxes one of
        those, is a bigger ask than it looks.
