name: release

# A tag builds the artifacts; it does not publish them. .goreleaser.yaml sets
# `release: draft`, so what lands is a draft release nobody can install until a
# human presses Publish. That split is deliberate: dsx speaks an undocumented
# private API and reads Claude Code's OAuth token, and the decision to put a
# binary that does both in front of strangers is a person's, not a tag's.
#
# To cut one: `git tag -a v0.1.0 -m v0.1.0 && git push origin v0.1.0`.
# To rehearse without a tag, run `goreleaser build --snapshot --clean` locally —
# it exercises every build target and produces nothing public.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Provenance is signed with a short-lived OIDC identity minted for this run;
  # there is no key to store and none to leak. Both are required by
  # attest-build-provenance and neither is needed by anything else here.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the changelog from git history; a shallow clone
          # would silently produce an empty one.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      # goreleaser's own failure on a missing HOMEBREW_TAP_TOKEN arrives too
      # late to be a refusal: the cask pipe runs after the release pipe, so by
      # the time the unresolved `{{ .Env.HOMEBREW_TAP_TOKEN }}` errors, the
      # draft release and every archive already exist — and the job dying there
      # takes the attestation step below with it, leaving artifacts published
      # with no provenance. Asked here, the same missing secret costs a tag and
      # nothing else.
      - name: refuse a release the tap token cannot finish
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; homebrew_casks in .goreleaser.yaml cannot publish to somework/homebrew-tap. Nothing was built." >&2
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Homebrew cask lands in somework/homebrew-tap, which the token
          # above cannot reach: GITHUB_TOKEN is scoped to this repository. This
          # is a fine-grained PAT holding contents:write and
          # pull-requests:write on the tap and nothing else. The step above is
          # what makes its absence a refusal rather than a half-done release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # checksums.txt says the archives are internally consistent; it says
      # nothing about who built them. Provenance does: it binds each artifact to
      # this repository, this workflow and this commit, so
      # `gh attestation verify <file> --repo somework/dsx` answers a question a
      # checksum cannot. That matters more here than for most tools — dsx reads
      # an OAuth credential, so a substituted binary is a credential thief with
      # a plausible name.
      #
      # The archives AND checksums.txt are both subjects. Attesting only the
      # archives would leave the file people actually verify against unsigned.
      - name: attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
