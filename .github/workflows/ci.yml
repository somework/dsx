name: ci

# Every third-party action is pinned to a commit SHA with its tag in a trailing
# comment. A tag is a movable pointer: whoever can push to the action's
# repository can change what `@v7` means, and these jobs run with a token that
# can read this repository — the release workflow's can write to it. The comment
# is what keeps the pin readable, and dependabot updates both halves together.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # dsx has one platform-specific file per OS (auth_darwin.go reads the
    # Keychain, auth_other.go does not). Building on only one of them would
    # leave the other's compile errors to be found by a user.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: release stamp reaches main.version
        # The one property no test can see. `var version` lives in package main
        # because -X names a symbol by its full path, and goreleaser writes
        # main.version -- but -X against a symbol that does not exist builds with
        # no error and no warning, so the binary would ship reporting "(unknown)"
        # with the whole suite green. version_test.go cannot catch it: it passes
        # the stamp to buildVersion itself rather than reading the var. Only
        # building with a stamp and looking for it can, so that is what this does.
        run: |
          go build -ldflags "-X main.version=v0.0.0-cistamp" -o ./dsx-stamp-probe .
          got=$(./dsx-stamp-probe version)
          rm -f ./dsx-stamp-probe
          case "$got" in
            *v0.0.0-cistamp*) echo "ok: $got" ;;
            *) echo "::error::-X main.version no longer reaches its target; dsx reported: $got"; exit 1 ;;
          esac

      - name: test
        # The live suite is excluded by its build tag: it needs a real login and
        # writes to a real project. CI has neither and must not acquire either.
        #
        # -coverpkg=./... attributes coverage to the package a line lives in
        # rather than the package whose test drove it. It is a no-op while the
        # binary is one package -- measured: identical totals with and without --
        # and it is here so that the floor keeps measuring the same thing if a
        # line ever moves into a subpackage. Without it, moving a file under
        # internal/ drops its coverage to whatever its own tests reach and the
        # floor fails on an attribution artifact, not on erosion.
        #
        # The denominator is shipped code only. internal/clitest and
        # internal/mcptest are test-support packages -- imported solely from
        # _test.go, never reachable from the binary -- so they are excluded
        # rather than allowed to dilute a floor that measures product erosion.
        # This is the "exclude it explicitly" the flag's own note called for once
        # such a package existed; do not drop the flag instead.
        run: |
          pkgs=$(go list ./... | grep -v -e /clitest -e /mcptest | paste -sd, -)
          go test -race -coverpkg="$pkgs" -coverprofile=cover.out ./...

      - name: coverage floor
        # The floor is a ratchet against silent erosion, not a target to game.
        # plan.go and envelope.go are held higher because that is where a bug
        # costs data rather than convenience.
        #
        # The per-file floor is computed the same statement-weighted way as the
        # overall floor: covered_stmts/total_stmts from cover.out's raw
        # records, not an unweighted mean of go tool cover -func's per-function
        # percentages (that mean gives a 1-line helper and a 200-line function
        # equal votes -- not the ratio it claims to gate). Records are deduped
        # by (file, block position) before counting: with -coverpkg the same
        # block can appear once per importing test binary, and summing
        # numstmt across those duplicates would inflate the denominator.
        run: |
          go tool cover -func=cover.out | tail -1
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          awk -v t="$total" 'BEGIN { if (t+0 < 80) { printf "::error::total coverage %.1f%% is under the 80%% floor\n", t; exit 1 } }'
          for f in plan.go envelope.go; do
            pct=$(awk -v f="$f" '
              $1 !~ /^mode:/ {
                split($1, a, ":");
                path = a[1];
                if (path == f || path ~ ("/" f "$")) {
                  key = $1;
                  if (!(key in stmt)) { stmt[key] = $2 }
                  cnt[key] += $3;
                }
              }
              END {
                total = 0; covered = 0;
                for (k in stmt) {
                  total += stmt[k];
                  if (cnt[k] > 0) covered += stmt[k];
                }
                if (total == 0) { print 0; exit }
                printf "%.4f", covered / total * 100;
              }
            ' cover.out)
            awk -v p="$pct" -v f="$f" 'BEGIN { if (p+0 < 95) { printf "::error::%s coverage %.1f%% is under its 95%% floor\n", f, p; exit 1 } }'
          done

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
      # staticcheck is a CI tool, not a dependency: it never enters go.mod, so
      # the shipped binary stays stdlib-only. That is the whole constraint.
      #
      # Pinned, and @latest is the mistake it replaces: staticcheck adds checks
      # between releases, so an unrelated pull request goes red on a day nobody
      # touched it and the finding is real but untimely. Bumping the version is
      # then a commit of its own, which is where a new check belongs. Same
      # version in README and CONTRIBUTING, or a contributor's local run and CI
      # disagree — the one thing a lint gate must never do.
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  govulncheck:
    # Deliberately NOT pinned, and the asymmetry with staticcheck above is the
    # point: a new lint check failing CI is noise arriving on someone else's
    # pull request, whereas a newly disclosed vulnerability failing CI is the
    # signal this job exists to deliver. Stdlib-only is not vulnerability-free —
    # go.mod names no dependency, but the standard library and the toolchain are
    # exactly what govulncheck reads, and dsx handles an OAuth credential and
    # parses untrusted server bytes with them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    # Proof that every release target compiles, without releasing anything.
    runs-on: ubuntu-latest
    strategy:
      # Same reason the test matrix carries it: the point of four targets is to
      # learn the state of all four. Under the default fail-fast the first one
      # to break cancels the rest, so a commit that broke darwin/arm64 and
      # linux/amd64 reports one failure and three cancellations, and the second
      # break is found by whoever fixes the first. It also makes a genuine
      # compile failure indistinguishable at a glance from a runner that was
      # never assigned -- which is exactly the shape an Actions outage produced
      # here on 2026-07-24, and it cost fifteen API calls to tell apart.
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o /dev/null .

  crossbuild:
    # Produces the artifacts a release would, so the smoke job below can run the
    # thing users actually download rather than something merely similar.
    #
    # goreleaser does the building instead of a hand-written go build, and that
    # is the point: -trimpath, -s -w, CGO_ENABLED=0 and -X main.version live in
    # .goreleaser.yaml, and a second copy here would agree until the day it
    # quietly did not. Same action and same version constraint as
    # release.yml for the same reason.
    #
    # --skip=before because .goreleaser.yaml's own hooks run `go test -race`,
    # which the test job above already did.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,announce,before

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-archives
          path: dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  smoke:
    # `go build -o /dev/null` in the build job proves the code COMPILES for a
    # target. It says nothing about whether the resulting file starts, and the
    # gap is not theoretical: dsx ships four binaries cross-compiled on Linux,
    # and macOS refuses to exec a darwin/arm64 binary that carries no signature
    # at all -- a whole class of "built fine, will not launch" that a discarded
    # output file cannot see.
    #
    # So each archive is unpacked on a runner of its own platform, by the same
    # two commands README tells a user to run, and the binary is asked questions
    # it can answer with no credential and no network:
    #
    #   version      the -X stamp reached main.version, and the binary knows
    #                which platform it is -- the release's own claim about itself
    #   help         the registry builds and usage renders
    #   help --json  the machine surface is a parseable document
    #   status       an unbound directory is refused with exit 2, which walks the
    #                ledger lookup without asking the network anything
    #   auth         no credential is exit 5, and on darwin that answer comes
    #                back through security(1) -- the one lane a Linux-hosted
    #                build can break invisibly
    #
    # `doctor` is deliberately absent: it contacts the endpoint, and CI has no
    # credential and must not acquire one.
    needs: crossbuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          # macos-15-intel, not macos-13: the last free Intel image was retired
          # in December 2025, and this label is the migration target GitHub
          # named for OSS. It carries an announced end -- available until
          # AUGUST 2027, after which x86_64 is not supported on Actions at all
          # (actions/runner-images#13045). When it goes, this row loses its
          # runner and the job will sit unschedulable rather than fail with
          # anything self-explanatory, so the question to answer then is whether
          # dsx still ships a darwin/amd64 binary it cannot run anywhere.
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: snapshot-archives

      - name: unpack the way README says to
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          archive=$(ls dsx_*_"${GOOS}"_"${GOARCH}".tar.gz)
          echo "archive: $archive"
          tar xzf "$archive" dsx
          chmod +x dsx

      - name: it starts, and knows what it is
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          got=$(./dsx version)
          echo "$got"
          case "$got" in
            *"${GOOS}/${GOARCH}"*) ;;
            *) echo "::error::version does not name ${GOOS}/${GOARCH}: $got"; exit 1 ;;
          esac
          case "$got" in
            *'(unknown)'*) echo "::error::the release build lost its version stamp: $got"; exit 1 ;;
          esac

      - name: usage renders and the machine surface parses
        run: |
          set -eu
          ./dsx help > /dev/null
          ./dsx help --json | jq -e 'has("commands") and has("flags")' > /dev/null
          ./dsx completion bash > /dev/null

      - name: an unbound directory is refused, with no network
        run: |
          set -eu
          work=$(mktemp -d)
          cd "$work"
          set +e
          out=$("$GITHUB_WORKSPACE/dsx" status --json 2>&1); code=$?
          set -e
          echo "exit=$code out=$out"
          [ "$code" = "2" ] || { echo "::error::unbound status exited $code, want 2"; exit 1; }
          printf '%s' "$out" | jq -e '.error == "usage"' > /dev/null

      - name: no credential is exit 5, through this platform's store
        # HOME points at an empty directory, and that is what makes this a
        # statement about the BINARY rather than about the host it runs on.
        # Written without the override it passes on a runner only because no
        # runner happens to hold a Claude Code login -- and it inverts on the
        # machine of anyone reproducing CI, which is where a dry run of these
        # steps caught it: with a real login present, auth answered 0.
        # DSX_TOKEN is cleared for the same reason.
        env:
          HOME: ${{ runner.temp }}/nologin
          DSX_TOKEN: ''
        run: |
          set -eu
          mkdir -p "$HOME"
          set +e
          out=$("$GITHUB_WORKSPACE/dsx" auth 2>&1); code=$?
          set -e
          echo "exit=$code out=$out"
          [ "$code" = "5" ] || { echo "::error::auth without a credential exited $code, want 5"; exit 1; }
