name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # dsx has one platform-specific file per OS (auth_darwin.go reads the
    # Keychain, auth_other.go does not). Building on only one of them would
    # leave the other's compile errors to be found by a user.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: release stamp reaches main.version
        # The one property no test can see. `var version` lives in package main
        # because -X names a symbol by its full path, and goreleaser writes
        # main.version -- but -X against a symbol that does not exist builds with
        # no error and no warning, so the binary would ship reporting "(unknown)"
        # with the whole suite green. version_test.go cannot catch it: it passes
        # the stamp to buildVersion itself rather than reading the var. Only
        # building with a stamp and looking for it can, so that is what this does.
        run: |
          go build -ldflags "-X main.version=v0.0.0-cistamp" -o ./dsx-stamp-probe .
          got=$(./dsx-stamp-probe version)
          rm -f ./dsx-stamp-probe
          case "$got" in
            *v0.0.0-cistamp*) echo "ok: $got" ;;
            *) echo "::error::-X main.version no longer reaches its target; dsx reported: $got"; exit 1 ;;
          esac

      - name: test
        # The live suite is excluded by its build tag: it needs a real login and
        # writes to a real project. CI has neither and must not acquire either.
        #
        # -coverpkg=./... attributes coverage to the package a line lives in
        # rather than the package whose test drove it. It is a no-op while the
        # binary is one package -- measured: identical totals with and without --
        # and it is here so that the floor keeps measuring the same thing if a
        # line ever moves into a subpackage. Without it, moving a file under
        # internal/ drops its coverage to whatever its own tests reach and the
        # floor fails on an attribution artifact, not on erosion.
        #
        # Safe here only because every package in ./... is shipped code. Add a
        # test-support package and it enters the denominator: exclude it
        # explicitly rather than dropping this flag.
        run: go test -race -coverpkg=./... -coverprofile=cover.out ./...

      - name: coverage floor
        # The floor is a ratchet against silent erosion, not a target to game.
        # plan.go and envelope.go are held higher because that is where a bug
        # costs data rather than convenience.
        run: |
          go tool cover -func=cover.out | tail -1
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          awk -v t="$total" 'BEGIN { if (t+0 < 80) { printf "::error::total coverage %.1f%% is under the 80%% floor\n", t; exit 1 } }'
          for f in plan.go envelope.go; do
            pct=$(go tool cover -func=cover.out | awk -v f="$f" '$1 ~ f {c++; s+=substr($NF,1,length($NF)-1)} END {if (c) print s/c; else print 0}')
            awk -v p="$pct" -v f="$f" 'BEGIN { if (p+0 < 95) { printf "::error::%s coverage %.1f%% is under its 95%% floor\n", f, p; exit 1 } }'
          done

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      # staticcheck is a CI tool, not a dependency: it never enters go.mod, so
      # the shipped binary stays stdlib-only. That is the whole constraint.
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  build:
    # Proof that every release target compiles, without releasing anything.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o /dev/null .
