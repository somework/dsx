version: 2

# A tag runs this (.github/workflows/release.yml) and what lands is a DRAFT — see
# `release: draft` at the foot of this file. Building and publishing are
# deliberately separate acts: dsx speaks an undocumented private API and reads
# Claude Code's OAuth token, so putting a binary that does both in front of
# strangers stays a person pressing a button. `goreleaser build --snapshot
# --clean` rehearses every target locally and produces nothing public.

project_name: dsx

before:
  hooks:
    - go mod tidy
    - go test -race ./...

builds:
  - id: dsx
    main: .
    binary: dsx
    # No cgo: the point of this binary is that it is one trustworthy artifact
    # that reads a credential. A dynamic link is one more thing to trust.
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # -X main.version is the only stamp; version.go falls back to the
      # toolchain's build info when it is absent, so `go install` still reports
      # something truthful.
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - PROTOCOL.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  # The whole point of the tag/publish split: a tag builds artifacts and stops
  # at a draft, so nothing reaches a stranger without someone pressing Publish.
  draft: true
  prerelease: auto
  # The generated list above is raw git history and therefore in Russian. This
  # points a reader at the curated English record instead of leaving them to
  # infer one from commit subjects.
  footer: |
    ---
    Curated, caller-facing notes: [CHANGELOG.md](https://github.com/somework/dsx/blob/main/CHANGELOG.md).
    The list above is the raw commit history.
